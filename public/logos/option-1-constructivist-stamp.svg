<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="stampBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D47761"/>
      <stop offset="100%" stop-color="#B2503F"/>
    </linearGradient>
    <filter id="opt1Shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4A180E" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#4A180E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#stampBase)" filter="url(#opt1Shadow)"/>

  <!-- Inner Tactile Postal/Stamp Perforation Frame -->
  <rect x="14" y="14" width="100" height="100" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Thermal Paper Slip (Emerged from top, torn at bottom) -->
  <path d="M34 26 H94 V84 L88 78 L82 84 L76 78 L70 84 L64 78 L58 84 L52 78 L46 84 L40 78 L34 84 Z" fill="#FCFAF6"/>

  <!-- Embossed Geometric Seal Mark (Constructivist 1968 Motif) -->
  <!-- Outer Debossed Ring -->
  <circle cx="64" cy="52" r="18" fill="none" stroke="#D47761" stroke-width="2.5" stroke-dasharray="1.5 3"/>

  <!-- Inner Solid Sunburst Core & Diagonal Slash -->
  <circle cx="64" cy="52" r="11" fill="#D47761" fill-opacity="0.15"/>
  <circle cx="64" cy="52" r="6" fill="#B2503F"/>
  <path d="M50 66 L78 38" stroke="#B2503F" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tiny Gold Star / Timestamp Accent -->
  <circle cx="96" cy="24" r="3.5" fill="#E8C36A"/>
</svg>
