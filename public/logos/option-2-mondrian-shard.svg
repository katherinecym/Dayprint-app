<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1E232A" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1E232A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas Tile (Raw Linen/Oatmeal) -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#F4EFE6" filter="url(#shardShadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="#E2DAC9" stroke-width="1.5"/>

  <!-- Mondrian / Boogie Woogie Geometric Crystal Shard -->
  <g transform="translate(64, 64)">
    <!-- Top Face (Parchment Paper White) -->
    <path d="M0 -36 L34 -16 L0 4 L-34 -16 Z" fill="#FDFBF7" stroke="#2B2D31" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Left Face (Morandi Prussian Blue) -->
    <path d="M-34 -16 L0 4 L0 42 L-34 22 Z" fill="#5B7B94" stroke="#2B2D31" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Right Face (Morandi Terracotta Ochre) -->
    <path d="M0 4 L34 -16 L34 22 L0 42 Z" fill="#C97A63" stroke="#2B2D31" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Accent Intersection Plane (Mineral Mustard Gold) -->
    <path d="M0 4 L18 -6 L18 14 L0 24 Z" fill="#C49A56" fill-opacity="0.9" stroke="#2B2D31" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Inner Central Core / Connecting Node Spark -->
    <circle cx="0" cy="4" r="3.5" fill="#FFFFFF" stroke="#2B2D31" stroke-width="2"/>
  </g>
</svg>
