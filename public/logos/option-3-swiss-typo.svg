<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="typoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E1D1A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Clean Editorial Warm Newsprint Paper Background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#F7F3EB" filter="url(#typoShadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="#E6DEC9" stroke-width="1.5"/>

  <!-- Minimalist Constructivist Diagonal Ribbon Accent (1968 homage) -->
  <path d="M8 36 L36 8 H48 L8 48 Z" fill="#C97A63" fill-opacity="0.3"/>

  <!-- Iconic Swiss Grotesk lower-case "d" with Architectural Proportions -->
  <!-- Vertical Stem -->
  <rect x="74" y="28" width="15" height="66" rx="4" fill="#201E1C"/>

  <!-- Round Bowl of "d" (Forms a clean circular print stamp) -->
  <path d="M74 54 C74 41 40 41 40 62 C40 83 74 83 74 70" fill="none" stroke="#201E1C" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Signature Cinnabar Wax Seal Dot (The "." in "d.") -->
  <circle cx="100" cy="88" r="6.5" fill="#D47761"/>
  <circle cx="100" cy="88" r="3" fill="#FFFFFF" fill-opacity="0.4"/>
</svg>
